<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YoYo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YoYo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF3E0">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;color:#4A4A68;background:linear-gradient(180deg,#FFF3E0,#FCE4EC 50%,#E1F5FE);background-attachment:fixed;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;align-items:center}
h1{margin:0;color:#FF5E98;font-size:30px}
#face{font-size:64px;line-height:1.2;display:inline-block}
#status{text-align:center;font-size:18px;min-height:26px}
.in{opacity:0;animation:up .5s ease forwards;animation-delay:calc(var(--i)*90ms)}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.rec{position:relative;width:240px;height:240px;margin:6px 0}
.rec>*{position:absolute;inset:35px;border-radius:50%}
.ring{border:4px solid #FF5E98;opacity:0}
.on .ring{animation:ring 1.4s infinite}.on .ring+.ring{animation-delay:.7s}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.5);opacity:0}}
#rb{border:0;color:#fff;font-size:22px;font-weight:bold;background:linear-gradient(135deg,#FFB347,#FF5E98);box-shadow:0 8px 20px #ff5e9866;animation:breathe 1.1s ease-in-out infinite alternate;font-family:inherit}
.on #rb{animation:none}
@keyframes breathe{to{transform:scale(1.05)}}
.wig{animation:wig .18s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.card{width:100%;background:#fff;border-radius:24px;padding:16px;box-shadow:0 4px 14px #0001;margin-top:12px}
#card{display:none;text-align:center;padding:20px}
#card.show{display:block;animation:up .45s ease}
.sm{color:#8A8AA3;font-size:13px}
#sl{color:#FF5E98;font-size:30px;font-weight:bold;margin:6px 0}
.row{display:flex;gap:12px;width:100%;margin-top:12px}
button{font-family:inherit;border:0;border-radius:28px;color:#fff;font-size:16px;padding:15px 8px;flex:1;transition:transform .1s;cursor:pointer}
button:active{transform:scale(.94)}
.g{background:#43C59E}.o{background:#FF9F43}.b{background:#4FC3F7}.p{background:#A78BFA}.r{background:#EF5350}
.full{width:100%;margin-top:10px;flex:none}
#other{color:#7C5CFF;font-weight:bold;padding:10px;display:inline-block}
#sum{white-space:pre-line;font-size:15px;line-height:1.7}
.fl{position:fixed;bottom:15vh;font-size:28px;pointer-events:none;animation:fl 1.8s ease-out forwards}
@keyframes fl{to{transform:translateY(-55vh);opacity:0}}
#ov{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:9}
#ov.show{display:flex}
#sh{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:80vh;overflow:auto;animation:up .3s ease}
#sh h3{margin:0 0 8px}#sh p{white-space:pre-line;line-height:1.7;margin:0 0 8px;font-size:15px}
#sh .it{display:block;width:100%;background:#F3F0FF;color:#4A4A68;margin-top:8px;text-align:right;border-radius:16px;padding:14px}
</style>
</head>
<body>
<div class="app">
 <h1 class="in" style="--i:0">YoYo</h1>
 <div id="face" class="in" style="--i:1">👶</div>
 <div id="status" class="in" style="--i:2">اضغط الزرار لما يويو يبكي</div>
 <div class="rec in" id="rec" style="--i:3"><div class="ring"></div><div class="ring"></div><button id="rb">🎙️<br>ابدأ</button></div>

 <div class="card" id="card">
  <div class="sm" id="ss"></div>
  <div>جرّب دلوقتي 👇</div>
  <div id="sl"></div>
  <div id="st"></div>
  <div class="sm" id="sc" style="margin-top:8px"></div>
  <div style="margin-top:14px;font-weight:bold">بعد ما تجرّب، نفع؟</div>
  <div class="row"><button class="g" id="ok">نفع 👍</button><button class="o" id="no">ما نفعش 👎</button></div>
  <div id="other">السبب حاجة تانية ✏️</div>
  <div class="sm" id="sn"></div>
 </div>

 <div class="card in" id="sum" style="--i:4"></div>
 <div class="row in" style="--i:5"><button class="b" id="feed">🍼 رضعة الآن</button><button class="p" id="dia">🧷 غيّرت الحفاضة</button></div>
 <div id="log" class="in" style="--i:6;margin-top:8px;font-size:14px;text-align:center"></div>
 <button class="g full in" id="hist" style="--i:7">📒 السجل (تحديد السبب بعدين)</button>
 <button class="r full in" id="red" style="--i:8">🚨 علامات الخطر</button>
 <p class="sm" style="text-align:center;margin-top:18px">التطبيق بيتعلم من تسجيلاتك أنت بس، ودقته متواضعة في الأول. هو مش تشخيص ومش بديل عن الدكتور.</p>
</div>
<div id="ov"><div id="sh"></div></div>

<script>
const $=id=>document.getElementById(id);
const DEF=["جوع","تجشّؤ","ألم بطن","عدم ارتياح","تعب"];
const EMO={"جوع":"🍼","تجشّؤ":"💨","ألم بطن":"🤕","عدم ارتياح":"🧷","تعب":"😴"};
const TIP={"جوع":"رضّعه دلوقتي وشوف لو بيرضع بشهية.","تجشّؤ":"شيّله على كتفك أو اقعّده، وطبطب على ضهره بخفة لمدة 5 دقايق.","ألم بطن":"دلّك بطنه بلطف في اتجاه عقارب الساعة، وحرّك رجليه كأنه بيركب عجلة.","عدم ارتياح":"افحص الحفاضة والهدوم (مبلولة أو ضيقة) وحرارة الأوضة.","تعب":"هدّي الإضاءة والصوت، لفّه بخفة وهزّه لحد ما ينام."};
const em=l=>EMO[l]||"⭐";
const tip=l=>TIP[l]||`جرّب اللي بتعمله عادة لما السبب يكون "${l}".`;

let S;try{S=JSON.parse(localStorage.yoyo)}catch(e){}
S=S||{recs:[],feed:0,diaper:0};
const save=()=>{if(S.recs.length>600)S.recs=S.recs.slice(-600);try{localStorage.yoyo=JSON.stringify(S)}catch(e){}};

// ---------- تحليل الصوت ----------
function fft(re,im){const n=re.length;let j=0;
 for(let i=1;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
 for(let len=2;len<=n;len<<=1){const a=-2*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a),h=len/2;
  for(let i=0;i<n;i+=len){let cr=1,ci=0;
   for(let k=0;k<h;k++){const ur=re[i+k],ui=im[i+k],xr=re[i+k+h],xi=im[i+k+h];
    const vr=xr*cr-xi*ci,vi=xr*ci+xi*cr;
    re[i+k]=ur+vr;im[i+k]=ui+vi;re[i+k+h]=ur-vr;im[i+k+h]=ui-vi;
    const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}}
function feats(x,sr){
 const N=512,H=256,B=16;if(x.length<sr)return null;
 const F=Math.floor((x.length-N)/H)+1;if(F<4)return null;
 const en=new Float64Array(F);
 for(let f=0;f<F;f++){let e=0;for(let i=0;i<N;i++){const v=x[f*H+i];e+=v*v}en[f]=e/N}
 const s=Array.from(en).sort((a,b)=>a-b);
 const noise=s[Math.floor(F*.1)],peak=s[Math.min(Math.floor(F*.95),F-1)];
 if(peak<1e-7)return null;
 const thr=Math.max(noise*4,peak*.1);
 const win=Array.from({length:N},(_,i)=>.5-.5*Math.cos(2*Math.PI*i/(N-1)));
 const bin=sr/N;
 const edges=Array.from({length:B+1},(_,k)=>Math.min(N/2,Math.max(1,Math.floor(150*Math.pow(7500/150,k/B)/bin))));
 const bs=new Float64Array(B),re=new Float64Array(N),im=new Float64Array(N);
 let loud=0,voiced=0;const pit=[];
 const minLag=Math.floor(sr/600),maxLag=Math.floor(sr/250);
 for(let f=0;f<F;f++){if(en[f]<thr)continue;loud++;const o=f*H;
  for(let i=0;i<N;i++){re[i]=x[o+i]*win[i];im[i]=0}
  fft(re,im);
  for(let b=0;b<B;b++){let p=0;const lo=edges[b],hi=Math.max(edges[b+1],lo+1);
   for(let k=lo;k<Math.min(hi,N/2);k++)p+=re[k]*re[k]+im[k]*im[k];
   bs[b]+=Math.log(p+1e-10)}
  let r0=0;for(let i=0;i<N;i++)r0+=x[o+i]*x[o+i];
  let bR=0,bL=0;
  for(let lag=minLag;lag<=maxLag;lag++){let r=0;for(let i=0;i<N-lag;i++)r+=x[o+i]*x[o+i+lag];if(r>bR){bR=r;bL=lag}}
  if(r0>0&&bL>0&&bR/r0>.3){voiced++;pit.push(sr/bL)}}
 if(loud<4)return null;
 const bands=Array.from(bs,v=>v/loud);const m=bands.reduce((a,b)=>a+b,0)/B;
 for(let i=0;i<B;i++)bands[i]-=m;
 const pm=pit.length?pit.reduce((a,b)=>a+b,0)/pit.length:0;
 const ps=pit.length>1?Math.sqrt(pit.reduce((a,p)=>a+(p-pm)*(p-pm),0)/pit.length):0;
 return [...bands,pm/100,ps/50,2*voiced/loud,2*loud/F];
}

// ---------- المكتبة والتعلّم ----------
const labels=()=>[...new Set([...DEF,...S.recs.filter(r=>r.l).map(r=>r.l)])];
const groups=()=>{const g={};S.recs.forEach(r=>{if(r.l)(g[r.l]=g[r.l]||[]).push(r)});
 Object.keys(g).forEach(k=>{if(g[k].length<3)delete g[k]});return g};
const dist=(a,b)=>Math.sqrt(a.reduce((s,v,i)=>s+(v-b[i])*(v-b[i]),0));
const cen=rs=>rs[0].f.map((_,i)=>rs.reduce((s,r)=>s+r.f[i],0)/rs.length);
const intra=(rs,c)=>rs.reduce((s,r)=>s+dist(r.f,c),0)/rs.length;
function prior(l,fm,dm){
 if(l=="جوع")return fm==null?2:fm>=150?3:fm>=90?2:.5;
 if(l=="تجشّؤ")return fm!=null&&fm<30?3:.7;
 if(l=="عدم ارتياح")return dm==null?1:dm>=180?2.5:.9;
 if(l=="ألم بطن")return fm!=null&&fm<90?1.5:1.2;
 if(l=="تعب")return 1;return .8}
function rank(f,fm,dm){
 const g=groups();
 const learned=Object.entries(g).map(([l,rs])=>{
  const ds=rs.map(r=>dist(f,r.f)).sort((a,b)=>a-b).slice(0,3);let d=ds.reduce((a,b)=>a+b,0)/ds.length;
  if(l=="جوع"&&fm!=null){if(fm<60)d*=1.2;else if(fm>150)d*=.9}
  return [l,d]}).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
 const rest=labels().filter(l=>!learned.includes(l)).sort((a,b)=>prior(b,fm,dm)-prior(a,fm,dm));
 return [...learned,...rest]}
const declined=new Set();
function mergeCand(){const g=groups(),ls=Object.keys(g);
 for(let i=0;i<ls.length;i++)for(let j=i+1;j<ls.length;j++){
  const a=ls[i],b=ls[j];if(declined.has(a+"|"+b))continue;
  const ca=cen(g[a]),cb=cen(g[b]);
  if(dist(ca,cb)<.6*(intra(g[a],ca)+intra(g[b],cb))/2)return[a,b]}
 return null}

// ---------- واجهة ----------
const face=e=>{const f=$("face");f.classList.remove("wig","pop");f.textContent=e;void f.offsetWidth;f.classList.add("pop")};
const status=t=>$("status").textContent=t;
function sheet(title,items,pick,msg){
 $("sh").innerHTML="";const h=document.createElement("h3");h.textContent=title;$("sh").append(h);
 if(msg){const p=document.createElement("p");p.textContent=msg;$("sh").append(p)}
 items.forEach((t,i)=>{const b=document.createElement("button");b.className="it";b.textContent=t;
  b.onclick=()=>{close();pick&&pick(i)};$("sh").append(b)});
 $("ov").classList.add("show")}
const close=()=>$("ov").classList.remove("show");
$("ov").onclick=e=>{if(e.target.id=="ov")close()};
function ago(t){if(!t)return"لسه مسجلتش";const m=Math.floor((Date.now()-t)/60000);
 return m<1?"حالاً":m<60?`قبل ${m} دقيقة`:m<1440?`قبل ${Math.floor(m/60)} ساعة`:`قبل ${Math.floor(m/1440)} يوم`}
function upd(){
 const c={};S.recs.forEach(r=>{if(r.l)c[r.l]=(c[r.l]||0)+1});
 let t=Object.keys(c).length?"🧠 اللي اتعلمه التطبيق:\n"+Object.entries(c).map(([l,n])=>`• ${em(l)} ${l}: ${n}`+(n<3?" (محتاج 3 عشان يتفعّل)":"")).join("\n")
  :"🧠 لسه مفيش تسجيلات متحدد سببها. كل ما تأكد سبب، التطبيق بيتعلم أكتر.";
 const u=S.recs.filter(r=>!r.l).length;if(u)t+=`\n\nتسجيلات من غير سبب: ${u}`;
 $("sum").textContent=t;
 $("log").textContent=`آخر رضعة: ${ago(S.feed)}   |   آخر حفاضة: ${ago(S.diaper)}`}
function burst(){["🎉","✨","💛","🌟","🎈","🍼"].concat(["🎉","✨","💛","🌟","🎈","🍼"]).forEach((e,i)=>{
 const s=document.createElement("span");s.className="fl";s.textContent=e;
 s.style.left=Math.random()*85+"vw";s.style.animationDelay=i*70+"ms";document.body.append(s);setTimeout(()=>s.remove(),2600)})}

let pending=null,queue=[],qi=0;
function showSug(){
 if(qi>=queue.length)return askOther();
 const l=queue[qi];
 $("ss").textContent=Object.keys(groups()).includes(l)?"من اللي اتعلمته من تسجيلاتك 🧠":"من المكتبة العامة 📚";
 $("sl").textContent=em(l)+" "+l;$("st").textContent=tip(l);
 $("sc").textContent=`آخر رضعة: ${ago(S.feed)}  |  آخر حفاضة: ${ago(S.diaper)}`;
 $("sn").textContent=`اقتراح ${qi+1} من ${queue.length}`;
 [$("sl"),$("st")].forEach(e=>{e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")})}
const hideCard=()=>$("card").classList.remove("show");
function setLabel(r,l){
 r.l=l;save();if(r===pending){pending=null;hideCard()}
 face("🥰");status("الحمد لله 🎉 اتسجل إن السبب: "+l);burst();upd();
 const m=mergeCand();
 if(m)sheet("سببين شبه بعض",["ادمج","لأ، سيبهم"],i=>{
  if(i==0){S.recs.forEach(x=>{if(x.l==m[1])x.l=m[0]});save();upd()}else declined.add(m[0]+"|"+m[1])},
  `صوت "${m[0]}" و"${m[1]}" قريب جداً من بعض. تدمجهم في "${m[0]}"؟`)}
function chooser(r,title){
 const ls=labels();
 sheet(title,[...ls.map(l=>em(l)+" "+l),"➕ سبب جديد","🤷 مش عارف دلوقتي (أحدد بعدين)"],i=>{
  if(i<ls.length)setLabel(r,ls[i]);
  else if(i==ls.length){const n=(prompt("اسم السبب (مثلاً: عايز يتشال)")||"").trim();if(n)setLabel(r,n)}
  else{if(r===pending){pending=null;hideCard()}face("😊");status("اتحفظ من غير سبب. تقدر تحدده بعدين من السجل.")}})}
function askOther(){if(!pending)return;face("🧐");status("خلصت اقتراحاتي. إيه اللي نفع فعلاً؟");chooser(pending,"إيه السبب الفعلي؟")}
$("ok").onclick=()=>{if(pending&&qi<queue.length)setLabel(pending,queue[qi])};
$("no").onclick=()=>{qi++;if(qi<queue.length){face("🤔");status("ماشي، جرّب الاقتراح اللي بعده");showSug()}else askOther()};
$("other").onclick=()=>pending&&chooser(pending,"إيه السبب الفعلي؟");
$("feed").onclick=()=>{S.feed=Date.now();save();upd();face("😋");status("اتسجلت الرضعة 🍼")};
$("dia").onclick=()=>{S.diaper=Date.now();save();upd();face("😊");status("اتسجل تغيير الحفاضة 🧷")};
$("hist").onclick=()=>{const l=S.recs.slice(-20).reverse();
 if(!l.length)return status("لسه مفيش تسجيلات.");
 sheet("اضغط على تسجيل لتحديد أو تعديل سببه",l.map(r=>`${ago(r.id)}  —  ${r.l||"بدون سبب"}`),i=>chooser(l[i],"السبب الفعلي لهذا التسجيل؟"))};
$("red").onclick=()=>sheet("علامات الخطر",["تمام"],null,
`🚨 إسعاف أو طوارئ فوراً (الإسعاف في مصر 123):
• ازرقاق أو شحوب شديد في الشفايف أو اللسان أو الوجه
• توقف النفس أكتر من 10 ثواني، أو نفس سريع جداً مع شفط في الصدر أو أنين
• خمول شديد: مش بيصحى أو جسمه مرتخي
• تشنجات أو رعشة مش بتبطل
• قيء أخضر أو فيه دم، أو براز فيه دم

📞 كلم الدكتور فوراً (أو روح الطوارئ لو مفيش رد):
• حرارة 38 أو أكتر لو عمره أقل من 3 شهور
• رفض الرضاعة أكتر من رضعة أو اتنين
• بكاء متواصل مش بيهدا بأي حاجة لساعات
• اصفرار الجلد أو العين
• قلة التبول (أقل من 4 حفاضات مبلولة في اليوم بعد اليوم الرابع)
• بطن منتفخ وقاسي، أو إسهال أو قيء متكرر

لو قلقان من أي حاجة مش مكتوبة هنا، كلم الدكتور. التطبيق مش بديل عنه.`);

// ---------- التسجيل ----------
let ctx,stream,proc,chunks,total,recording=false;
async function startRec(){
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
 catch(e){return status("لازم تسمح باستخدام المايك (أو افتح الصفحة عبر https)")}
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 if(ctx.resume)await ctx.resume();
 const src=ctx.createMediaStreamSource(stream);
 proc=ctx.createScriptProcessor(4096,1,1);chunks=[];total=0;recording=true;
 proc.onaudioprocess=e=>{if(!recording)return;chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));total+=4096;if(total>ctx.sampleRate*30)stopRec()};
 src.connect(proc);proc.connect(ctx.destination);
 hideCard();$("rec").classList.add("on");$("rb").innerHTML="⏹️<br>إيقاف";
 face("😭");$("face").classList.add("wig");status("جاري التسجيل... قرّب الموبايل من يوِيو")}
function stopRec(){
 if(!recording)return;recording=false;
 proc.disconnect();stream.getTracks().forEach(t=>t.stop());
 const sr=ctx.sampleRate;ctx.close();
 const x=new Float32Array(total);let p=0;chunks.forEach(c=>{x.set(c,p);p+=c.length});
 const k=Math.max(1,Math.round(sr/16000)),n=Math.floor(total/k),y=new Float32Array(n);
 for(let i=0;i<n;i++){let s=0;for(let j=0;j<k;j++)s+=x[i*k+j];y[i]=s/k}
 $("rec").classList.remove("on");$("rb").innerHTML="🎙️<br>ابدأ";face("🤔");status("بحلل الصوت...");
 setTimeout(()=>onDone(feats(y,sr/k)),50)}
function onDone(f){
 if(!f){face("🙈");return status("التسجيل قصير أو هادي. سجّل ثانيتين على الأقل وجرب تاني.")}
 const now=Date.now(),r={id:now,f,l:null};S.recs.push(r);save();
 pending=r;queue=rank(f,S.feed?Math.floor((now-S.feed)/60000):null,S.diaper?Math.floor((now-S.diaper)/60000):null);qi=0;
 face("🤗");status("ده اقتراحي. جرّبه وقولي نفع ولا لأ");showSug();
